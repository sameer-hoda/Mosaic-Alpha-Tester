<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" rx="190" fill="#2E6DB4"/>
  <g transform="translate(512 512) rotate(-12) translate(-512 -512)">
