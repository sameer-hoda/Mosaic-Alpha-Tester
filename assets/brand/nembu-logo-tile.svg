    <!-- flesh -->
    <path d="M 270 522 C 400 405 620 360 730 390 C 790 520 765 655 685 715 C 500 735 340 645 270 522 Z"
          fill="#F9D71C"/>
    <!-- segments -->
    <g stroke="#FFF4CF" stroke-width="14" stroke-linecap="round" fill="none">
      <path d="M 330 515 L 735 405"/>
      <path d="M 350 550 L 770 485"/>
      <path d="M 370 585 L 775 575"/>
      <path d="M 395 620 L 750 655"/>
      <path d="M 430 650 L 700 710"/>
    </g>
    <!-- NEMBU: yellow letters, blue outline, no cream halo -->
    <text x="505" y="575" text-anchor="middle" font-family="Arial Rounded MT Bold, Arial, sans-serif"
          font-size="160" font-weight="700" letter-spacing="-9"
          fill="#1E4E8C" transform="translate(9 11) rotate(-12 505 575)">NEMBU</text>
    <text x="505" y="575" text-anchor="middle" font-family="Arial Rounded MT Bold, Arial, sans-serif"
          font-size="160" font-weight="700" letter-spacing="-9"
          fill="#F9D71C" stroke="#2E6DB4" stroke-width="16" paint-order="stroke"
          transform="rotate(-12 505 575)">NEMBU</text>
  </g>
</svg>
