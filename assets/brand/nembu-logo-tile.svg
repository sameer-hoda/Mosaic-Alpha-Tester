    <path d="M 165 520 C 330 330 650 270 810 320 C 900 520 870 720 745 815 C 500 845 270 735 165 520 Z"
          fill="#F9D71C"/>
    <!-- pith line -->
    <path d="M 225 522 C 375 370 645 320 772 360 C 842 525 815 690 712 760 C 500 780 310 680 225 522 Z"
